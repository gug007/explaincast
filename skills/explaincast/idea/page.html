<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<link rel="stylesheet" href="idea/stage.css">
<style>
/* Place every part once, over the whole 1100x620 stage. Parts never move after this. */
#a { left: 36px; top: 228px; }
#b { left: 430px; top: 228px; }
#c { left: 824px; top: 116px; }
#d { left: 824px; top: 360px; }
#detail { left: 366px; top: 402px; width: 368px; height: 158px; }
</style>
</head>
<body>
<div class="eyebrow"></div>
<h1 class="headline">{{title}}</h1>
<nav class="chapters"><span>Overview</span><span data-eyebrow="1 · TODO">TODO</span><span>Recap</span></nav>

<div class="node hidden" id="a" data-icon="monitor" data-title="TODO part" data-sub="TODO its role">
  <div data-s="idle"><span class="muted">TODO what it does at rest</span></div>
  <div data-s="busy"><span class="chip amber" id="value">TODO value</span><span class="muted">TODO what that value is</span></div>
</div>
<div class="node hidden" id="b" data-icon="server" data-title="TODO part" data-sub="TODO its role">
  <div data-s="idle"><span class="muted">TODO</span></div>
</div>
<div class="node hidden" id="c" data-icon="database" data-title="TODO part" data-sub="TODO its role">
  <div data-s="idle"><span class="muted">TODO</span></div>
</div>
<div class="node hidden" id="d" data-icon="mail" data-title="TODO part" data-sub="TODO its role">
  <div data-s="idle"><span class="muted">TODO</span></div>
</div>

<div class="card hidden" id="detail">
  <h5>TODO detail title</h5>
  <div data-s="checks">
    <div class="check" id="k1">TODO first check<small>TODO value</small></div>
  </div>
</div>

<script src="idea/stage.js"></script>
<script>
// Edges join parts by id. One that would cross a part takes explicit sides: { from: "bottom", to: "bottom" }.
stage.edge("ab", "a", "b");
stage.edge("bc", "b", "c");
stage.edge("bd", "b", "d");
stage.edge("da", "d", "a", { from: "bottom", to: "bottom" });

// One step per cue word in beats.js, in the order the narration says them.
stage.steps({
  first: async () => {
    stage.headline("TODO the point of this step, in one sentence");
    stage.show("a", "b", "c", "d");
    stage.focus("a", "b");
    stage.state("a", "busy");
    await stage.travel("ab", "value");
    stage.mark("b", "lit");
  },
});
</script>
</body>
</html>
