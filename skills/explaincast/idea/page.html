<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<link rel="stylesheet" href="idea/stage.css">
<style>
/* The product's own look: copy its colours from its source or its demo build. */
.screen.product { --ui-bg: #ffffff; --ui-panel: #f6f7f9; --ui-ink: #111827; --ui-muted: #6b7280; --ui-line: #e5e7eb; --ui-accent: #2563eb; }
/* A window fills the stage under the headline; .beside makes room for the phone. class="new" rings what a planned change adds. */
#app { left: 44px; top: 116px; width: 1012px; height: 480px; }
#app.beside { width: 716px; }
#phone { left: 806px; top: 116px; width: 240px; height: 480px; }
</style>
</head>
<body>
<h1 class="headline">{{title}}</h1>

<div class="screen product" id="app" data-title="TODO the window's title">
  <div class="ui-split">
    <div class="ui-side"><div class="ui-item on">TODO a sidebar row</div><div class="ui-item">TODO another</div></div>
    <div class="ui-main">
      <b>TODO the view's title</b>
      <div class="states ui-grow" id="result">
        <div data-s="before"><span class="ui-muted">TODO what it shows at first</span></div>
        <div data-s="after"><span>TODO what it shows once the control is used</span></div>
      </div>
      <div class="ui-row"><span class="ui-grow"></span><span class="ui-btn primary" id="control">TODO the control the line names</span></div>
    </div>
  </div>
</div>

<div class="screen product phone" id="phone">
  <div class="ui-main"><b>TODO the phone's view</b></div>
</div>

<script src="idea/stage.js"></script>
<script>
// One step per cue word in beats.js, in the order the narration says them.
stage.steps({
  first: async () => {
    stage.headline("TODO the point of this step, in one sentence");
    await stage.open("app");
    await stage.tap("control");
    stage.state("result", "after");
  },
  phone: async () => {
    stage.mark("app", "beside");
    await stage.open("phone");
  },
});
</script>
</body>
</html>
